[package]
name = "diffv"
version = "0.2.4"
edition = "2021"
authors = ["Felipe Godoi"]
description = "High-performance VS Code style CLI diff viewer and companion for AI coding agents"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
similar = { version = "2.6", features = ["inline", "bytes"] }
notify = "6.1"
notify-debouncer-mini = "0.4"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
anyhow = "1.0"
once_cell = "1.20"
walkdir = "2.5"
unicode-width = "0.2"
serde_json = "1"
sha2 = "0.10"
semver = "1"
tempfile = "3"
fs2 = "0.4"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
