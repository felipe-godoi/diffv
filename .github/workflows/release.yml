name: Release
on:
  push:
    branches: [main, beta]
    tags: ['v*', 'diffv-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            test: true
          # Cross-compiled on Apple Silicon: Intel runners are slower and queue longer.
          - os: macos-14
            target: x86_64-apple-darwin
            test: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        env:
          TARGET: ${{ matrix.target }}
        run: rustup update stable && rustup default stable && rustup target add "$TARGET"
      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag_clean="${RELEASE_TAG#diffv-}"
          test "v$version" = "$tag_clean"
      # Caches are scoped to the ref that saved them; only main and beta save.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' }}
      - name: Embed commit in version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          echo "DIFFV_VERSION=$version (${GITHUB_SHA::7} $(date -u +%Y-%m-%d))" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: rustup component add clippy && cargo clippy --all-targets --locked -- -D warnings
      - name: Package binary
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/diffv" "dist/diffv-$TARGET"
          cd dist
          shasum -a 256 "diffv-$TARGET" > "diffv-$TARGET.sha256"
      - uses: actions/upload-artifact@v7.0.1
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.event_name == 'workflow_dispatch'
        with:
          name: diffv-${{ matrix.target }}
          path: dist/*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/diffv-v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/diffv-v') || (github.event_name == 'workflow_dispatch' && github.ref_name != 'main' && github.ref_name != 'beta')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber || \
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "diffv $RELEASE_TAG" --generate-notes
      # Rolling channels: main -> `nightly`, beta -> `beta`. Idempotent (first run and re-runs).
      # The tag is moved with the API and the release is updated in place, so the assets are
      # never removed before the new ones are uploaded. Only "does not exist yet" is tolerated;
      # any other failure fails the job.
      - name: Publish rolling release (nightly from main, beta from beta)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            main)
              TAG=nightly
              TITLE="diffv nightly (latest main)"
              NOTES="Automated rolling nightly build from the latest commit on main (${GITHUB_SHA::7})."
              ;;
            beta)
              TAG=beta
              TITLE="diffv beta (latest RC)"
              NOTES="Automated rolling pre-release from the latest commit on beta (${GITHUB_SHA::7})."
              ;;
            *)
              echo "::error::No rolling channel for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac

          # 4 binaries + 4 .sha256: never publish (or prune a release) from an incomplete build.
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "::error::Expected 8 files in dist/, found $count"; ls -la dist; exit 1
          fi

          # A re-run of an old commit must not move the channel backwards.
          head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::warning::$GITHUB_REF_NAME is now at ${head_sha::7}, not ${GITHUB_SHA::7}; a newer run publishes $TAG."
            exit 0
          fi

          err=$(mktemp)

          # 1. Point the tag at this commit (create it, or force-move it).
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>"$err"; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true --silent
          elif grep -q "Not Found" "$err"; then
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          else
            cat "$err" >&2; exit 1
          fi

          release_exists() {
            if gh release view "$TAG" >/dev/null 2>"$err"; then return 0
            elif grep -qi "release not found" "$err"; then return 1
            else cat "$err" >&2; exit 1
            fi
          }

          # 2. Create the release, or update it in place: upload (overwrite) first, prune later.
          # (`|| return 1` on every command: set -e is ignored inside functions run in a `&&` list.)
          sync_release() {
            local names name
            if release_exists; then
              gh release upload "$TAG" dist/* --clobber || return 1
              names=$(gh release view "$TAG" --json assets --jq '.assets[].name') || return 1
              for name in $names; do
                [ -e "dist/$name" ] || gh release delete-asset "$TAG" "$name" --yes || return 1
              done
              gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --draft=false || return 1
            else
              gh release create "$TAG" dist/* --verify-tag --prerelease --title "$TITLE" --notes "$NOTES" || return 1
            fi
          }
          sync_release

          # 3. The Releases page sorts by created_at, which GitHub derives from the tagged commit.
          #    If the in-place update left it older than this commit, recreate the release
          #    (the tag stays; the new release gets all assets in the create call).
          commit_date=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq .commit.committer.date)
          created_at=$(gh release view "$TAG" --json createdAt --jq .createdAt)
          if [[ "$created_at" < "$commit_date" ]]; then
            echo "Release $TAG created_at ($created_at) predates commit ($commit_date); recreating it."
            gh release delete "$TAG" --yes
            for attempt in 1 2 3; do
              sync_release && break
              [ "$attempt" -lt 3 ] || { echo "::error::Could not recreate release $TAG"; exit 1; }
              sleep $((attempt * 5))
            done
          fi

          # 4. Verify the outcome; any mismatch fails the job.
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          [ "$tag_sha" = "$GITHUB_SHA" ] || { echo "::error::Tag $TAG is at $tag_sha, expected $GITHUB_SHA"; exit 1; }
          gh release view "$TAG" --json isPrerelease,isDraft,assets \
            --jq 'if .isPrerelease and (.isDraft|not) and (.assets|length) == 8 and all(.assets[]; .state == "uploaded") then empty else error("release \(.assets|length) assets, prerelease=\(.isPrerelease), draft=\(.isDraft)") end'
          created_at=$(gh release view "$TAG" --json createdAt --jq .createdAt)
          [[ ! "$created_at" < "$commit_date" ]] || { echo "::error::$TAG created_at $created_at predates commit $commit_date"; exit 1; }
          echo "Published $TAG at ${GITHUB_SHA::7} (release created_at $created_at)."
