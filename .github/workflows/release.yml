name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: [release-please]
    if: |
      always() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') &&
      (github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            test: true
          # Cross-compiled on Apple Silicon: Intel runners are slower and queue longer.
          - os: macos-14
            target: x86_64-apple-darwin
            test: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        env:
          TARGET: ${{ matrix.target }}
        run: rustup update stable && rustup default stable && rustup target add "$TARGET"
      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$RELEASE_TAG"
      # Caches are scoped to the ref that saved them; only main's cache is
      # visible to release tags, so main is the only ref that saves.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Embed commit in version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          echo "DIFFV_VERSION=$version (${GITHUB_SHA::7} $(date -u +%Y-%m-%d))" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: rustup component add clippy && cargo clippy --all-targets --locked -- -D warnings
      - name: Package binary
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/diffv" "dist/diffv-$TARGET"
          cd dist
          shasum -a 256 "diffv-$TARGET" > "diffv-$TARGET.sha256"
      - uses: actions/upload-artifact@v7.0.1
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          name: diffv-${{ matrix.target }}
          path: dist/*
  publish:
    needs: [release-please, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish stable release
        if: needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber || \
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "diffv $RELEASE_TAG" --generate-notes
      - name: Publish rolling nightly and beta release from main
        if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes || true
          git tag -d nightly 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
          gh release create nightly dist/* --target main --prerelease --title "diffv nightly (latest main)" --notes "Automated rolling nightly build from the latest commit on main (${GITHUB_SHA::7})."
          gh release delete beta --yes || true
          git tag -d beta 2>/dev/null || true
          git push origin :refs/tags/beta 2>/dev/null || true
          gh release create beta dist/* --target main --prerelease --title "diffv beta (latest main)" --notes "Automated rolling pre-release from the latest commit on main (${GITHUB_SHA::7})."
